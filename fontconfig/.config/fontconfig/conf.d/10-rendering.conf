<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
	<its:rules xmlns:its="http://www.w3.org/2005/11/its" version="1.0">
		<its:translateRule translate="no" selector="/fontconfig/*[not(self::description)]"/>
	</its:rules>

	<description>
		Pin antialiasing/hinting/subpixel rendering explicitly, rather than
		relying on whatever Arch's fontconfig package ships as its weak
		defaults. This is the single source of truth for rendering behaviour
		system-wide: GTK and Qt both fall back to fontconfig's own match
		when they don't set their own gtk-xft-*/Qt overrides, so leave those
		alone and tune rendering only here. See fontconfig/CLAUDE.md.
	</description>

	<match target="pattern">
		<edit mode="assign" name="antialias"><bool>true</bool></edit>
		<edit mode="assign" name="hinting"><bool>true</bool></edit>
		<edit mode="assign" name="hintstyle"><const>hintslight</const></edit>
		<edit mode="assign" name="autohint"><bool>false</bool></edit>
		<edit mode="assign" name="rgba"><const>rgb</const></edit>
		<edit mode="assign" name="lcdfilter"><const>lcddefault</const></edit>
	</match>
</fontconfig>
