permit setenv {PATH=/usr/local/bin:/usr/local/sbin:/usr/bin:/usr/sbin} :wheel
permit persist :wheel
permit keepenv root

# Let the hypridle suspend guard (~/.config/hypr/suspend-unless-active.sh) read
# Samba's root-only session state non-interactively. Read-only, scoped to the
# smbstatus binary; must stay after the :wheel rules so it wins (last match).
permit nopass david cmd /usr/bin/smbstatus
