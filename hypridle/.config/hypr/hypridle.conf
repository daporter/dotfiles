# Hyprland is configured in Lua, so hyprctl dispatch arguments are evaluated as
# Lua: bare `dpms off` is a syntax error and silently never runs. Dispatchers
# must be written as hl.dsp.* calls, matching hyprland.lua's own idiom.
general {
    after_sleep_cmd = ~/.config/hypr/wake-display.sh
}

listener {
    timeout    = 300		# 5min
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ state = "off" })'
    on-resume  = hyprctl dispatch 'hl.dsp.dpms({ state = "on" })'
}

listener {
    timeout    = 1800		# 30min
    on-timeout = ~/.config/hypr/suspend-unless-active.sh
}
